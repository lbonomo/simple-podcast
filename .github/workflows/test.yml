name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHPCS y PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer phpcs
      - run: composer phpstan

  js:
    name: Jest y build de assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LB_SP_DB_HOST: 127.0.0.1:3306
      LB_SP_DB_USER: root
      LB_SP_DB_PASSWORD: root
      LB_SP_DB_NAME: wordpress_test
      LB_SP_WP_ABSPATH: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, mbstring, dom, fileinfo
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Descargar WordPress
        run: |
          curl -fsSL https://wordpress.org/latest.tar.gz | tar -xz -C /tmp
      - name: Compilar assets (los usa el test de encolado)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: vendor/bin/phpunit

  package:
    name: Paquete .zip limpio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: bin/build-zip.sh
      - run: bin/verify-zip.sh lb-simple-podcast.zip
