name: Build release

on:
  push:
    tags:
      # Tags de versión sin prefijo "v" (ej. 0.2.0).
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar lb-simple-podcast.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: bin/build-zip.sh
      - run: bin/verify-zip.sh lb-simple-podcast.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lb-simple-podcast
          path: lb-simple-podcast.zip
          if-no-files-found: error
      # Adjunta el ZIP al release para que el actualizador del plugin lo descargue.
      - name: Subir ZIP al release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" lb-simple-podcast.zip --clobber \
            || gh release create "${GITHUB_REF_NAME}" lb-simple-podcast.zip --title "${GITHUB_REF_NAME}" --generate-notes
